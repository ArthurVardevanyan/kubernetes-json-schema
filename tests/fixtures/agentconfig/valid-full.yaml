---
apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: test-cluster
rendezvousIP: 10.101.10.101
bootArtifactsBaseURL: http://infra.example.com/boot
minimalISO: false
additionalNTPSources:
  - 0.rhel.pool.ntp.org
  - 192.168.1.1
hosts:
  - hostname: master-1
    role: master
    rootDeviceHints:
      deviceName: /dev/disk/by-path/pci-0000:02:00.1-ata-4.0
    interfaces:
      - name: enp1s0f0np0
        macAddress: 98:b7:85:22:14:04
      - name: enp6s0
        macAddress: b0:19:21:53:e0:2c
    networkConfig:
      interfaces:
        - name: bond0
          type: bond
          state: up
          mac-address: 98:b7:85:22:14:04
          mtu: 9000
          ipv4:
            enabled: true
            address:
              - ip: 10.101.10.101
                prefix-length: 24
            dhcp: false
          ipv6:
            enabled: false
          link-aggregation:
            mode: active-backup
            options:
              miimon: "150"
              primary: enp1s0f0np0
            port:
              - enp1s0f0np0
              - enp6s0
      dns-resolver:
        config:
          server:
            - 10.101.10.1
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 10.101.10.1
            next-hop-interface: bond0
            table-id: 254
  - hostname: worker-1
    role: worker
    rootDeviceHints:
      deviceName: /dev/sda
      minSizeGigabytes: 100
      rotational: false
    interfaces:
      - name: eth0
        macAddress: aa:bb:cc:dd:ee:ff
